plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = '1.1'
group = 'com.edgeburnmedia.batterystatusinfo'
base { archivesName = 'batterystatusinfo-forge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { batterystatusinfo { source sourceSets.main } }
        }
    }
}

sourceSets.main.resources { srcDir 'src/main/resources' }

repositories {
    mavenCentral()
}

dependencies {
    minecraft "net.minecraftforge:forge:1.20.1-47.4.10"

    // Same battery-info library the original Fabric build shaded in.
    implementation 'com.github.oshi:oshi-core:6.4.5'
    // JarJar embeds oshi-core (and jna/jna-platform) inside the built mod jar,
    // exactly like fabric.mod.json's "jars" entry did on Fabric.
    jarJar(group: 'com.github.oshi', name: 'oshi-core', version: '[6.4.5,6.5)') {
        jarJar.pin(it, '6.4.5')
    }
}

jarJar.enable()

jar {
    manifest {
        attributes([
            'Specification-Title'   : 'batterystatusinfo',
            'Specification-Vendor'  : 'Edgeburn Media',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.jar.archiveVersion,
            'Implementation-Vendor' : 'Edgeburn Media'
        ])
    }
}

tasks.named('jarJar').configure { finalizedBy 'reobfJarJar' }
